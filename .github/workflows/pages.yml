name: Publier Horizon sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les scripts
        run: |
          node --check dist/app.js
          node --check dist/crypto-import.js
          node --check dist/pwa.js
          node --check dist/sw.js
          node check.cjs
          node check-pwa.cjs
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers publics
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
